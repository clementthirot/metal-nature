# Configuration de Pages CMS (https://pagescms.org) : interface d'édition en ligne,
# connectée au dépôt GitHub. Aucune dépendance dans le site : chaque enregistrement
# crée un commit, puis Cloudflare Pages reconstruit le site automatiquement.
media:
  input: src/assets/realisations
  output: ../../assets/realisations
  extensions: [jpg, jpeg, png, webp]

content:
  - name: realisations
    label: Réalisations
    type: collection
    path: src/content/realisations
    filename: "{primary}.md"
    view:
      fields: [title, year, draft]
      primary: title
      sort: [order, title]
    fields:
      - name: title
        label: Nom du meuble
        type: string
        required: true
      - name: year
        label: Année de réalisation
        type: number
        required: true
      - name: order
        label: Ordre d'affichage (1 = en premier)
        type: number
        default: 100
      - name: image
        label: Photo (portrait, 360 × 480 px minimum, idéalement 720 × 960)
        type: image
        required: true
      - name: imageAlt
        label: Description de la photo (pour les malvoyants et Google)
        type: string
        required: true
      - name: model
        label: Modèle 3D (fichier public/3d/models/<nom>.glb, facultatif)
        type: select
        options:
          values: ['armoire', 'bibliotheque', 'commode-arquee', 'etagere', 'meuble-de-rangement', 'table-basse', 'tables-basses-imbriquees', 'vasque']
      - name: materials
        label: Matériaux (fiche technique)
        type: string
      - name: dimensions
        label: Dimensions, largeur en premier (ex. 300 × 210 × 60 cm (L × H × P))
        type: string
      - name: finish
        label: Finition
        type: string
      - name: duration
        label: Durée de fabrication
        type: string
      - name: need
        label: Le projet – besoin du client (facultatif)
        type: text
      - name: constraints
        label: Le projet – contraintes et solution (facultatif)
        type: text
      - name: priceFrom
        label: Prix indicatif (ex. à partir de 1 500 €, facultatif)
        type: string
      - name: draft
        label: Brouillon (non publié)
        type: boolean
        default: false
      - name: body
        label: Description
        type: text
        required: true

  - name: services
    label: Pages « Meubles sur mesure »
    type: collection
    path: src/content/services
    filename: "{primary}.md"
    view:
      fields: [title, order]
      primary: shortTitle
      sort: [order]
    fields:
      - { name: title, label: Titre de la page (H1), type: string, required: true }
      - { name: shortTitle, label: Titre court (liens), type: string, required: true }
      - { name: metaTitle, label: Titre Google (60 caractères environ), type: string, required: true }
      - { name: description, label: Description Google (155 caractères environ), type: text, required: true }
      - { name: intro, label: Phrase d'accroche, type: text, required: true }
      - { name: order, label: Ordre d'affichage, type: number, default: 100 }
      - { name: realisations, label: Réalisations liées (noms de fichier sans .md), type: string, list: true }
      - { name: body, label: Contenu, type: rich-text }
